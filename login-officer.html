<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Officer Login - CitySafe</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="login-container">

        <div class="login-box">

            <h1>🚨 CitySafe</h1>

            <h2>Officer Login</h2>

            <p>Login to access your Officer Dashboard</p>

            <form id="officerLoginForm">

                <label for="officer-id">
                    Officer ID
                </label>

                <input
                    type="text"
                    id="officer-id"
                    placeholder="Enter your Officer ID"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="login-note">
                Officer accounts are provided by the authorized department.
            </p>

            <a href="home.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </main>

    <script>
        document
            .getElementById("officerLoginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                window.location.href = "officer.html";

            });
    </script>

</body>

</html>
